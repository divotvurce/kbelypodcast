 <script>
        function changeImage(button) {
            const img = button
                .closest("section")
                .querySelector("img");

            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/*";

            input.onchange = function () {
                if (input.files[0]) {
                    img.src = URL.createObjectURL(input.files[0]);
                }
            };

            input.click();
        }
    </script>
